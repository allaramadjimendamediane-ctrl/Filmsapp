<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Film</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/films">
            Gestion des films
        </a>

        <div>

            <a href="/categories"
               class="btn btn-outline-light">
                Catégories
            </a>

            <a href="/films"
               class="btn btn-outline-light">
                Films
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h3 th:if="${film.id == null}">
                Ajouter un film
            </h3>

            <h3 th:if="${film.id != null}">
                Modifier un film
            </h3>

        </div>


        <div class="card-body">

            <form th:action="@{/films/enregistrer}"
                  th:object="${film}"
                  method="post">


                <!-- ID -->

                <input type="hidden"
                       th:field="*{id}">


                <!-- TITRE -->

                <div class="mb-3">

                    <label for="titre"
                           class="form-label">
                        Titre du film
                    </label>

                    <input type="text"
                           id="titre"
                           class="form-control"
                           th:field="*{titre}"
                           placeholder="Exemple : Inception"
                           required>

                </div>


                <!-- REALISATEUR -->

                <div class="mb-3">

                    <label for="realisateur"
                           class="form-label">
                        Réalisateur
                    </label>

                    <input type="text"
                           id="realisateur"
                           class="form-control"
                           th:field="*{realisateur}"
                           placeholder="Exemple : Christopher Nolan"
                           required>

                </div>


                <!-- ANNEE -->

                <div class="mb-3">

                    <label for="annee"
                           class="form-label">
                        Année
                    </label>

                    <input type="number"
                           id="annee"
                           class="form-control"
                           th:field="*{annee}"
                           placeholder="Exemple : 2010"
                           min="1900"
                           max="2100">

                </div>


                <!-- CATEGORIE -->

                <div class="mb-3">

                    <label for="categorie"
                           class="form-label">
                        Catégorie
                    </label>

                    <select id="categorie"
                            class="form-select"
                            th:field="*{categorie.id}"
                            required>

                        <option value="">
                            -- Choisir une catégorie --
                        </option>

                        <option th:each="categorie : ${categories}"
                                th:value="${categorie.id}"
                                th:text="${categorie.nom}">
                        </option>

                    </select>

                </div>


                <!-- BOUTONS -->

                <button type="submit"
                        class="btn btn-success">
                    Enregistrer
                </button>


                <a href="/films"
                   class="btn btn-secondary">
                    Annuler
                </a>

            </form>

        </div>

    </div>

</div>


</body>
</html>
