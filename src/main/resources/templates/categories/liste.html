<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liste des catégories</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/categories">
            Gestion des films
        </a>

        <div>
            <a href="/categories" class="btn btn-outline-light">
                Catégories
            </a>

            <a href="/films" class="btn btn-outline-light">
                Films
            </a>
        </div>
    </div>
</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Liste des catégories</h1>

        <a href="/categories/ajouter"
           class="btn btn-primary">
            + Ajouter une catégorie
        </a>

    </div>


    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="categorie : ${categories}">

            <td th:text="${categorie.id}">
                1
            </td>

            <td th:text="${categorie.nom}">
                Action
            </td>

            <td>

                <a th:href="@{/categories/modifier/{id}(id=${categorie.id})}"
                   class="btn btn-warning btn-sm">
                    Modifier
                </a>

                <a th:href="@{/categories/supprimer/{id}(id=${categorie.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Voulez-vous vraiment supprimer cette catégorie ?');">
                    Supprimer
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(categories)}">

            <td colspan="3" class="text-center">
                Aucune catégorie enregistrée.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
