<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Catégorie</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/categories">
            Gestion des films
        </a>

        <div>

            <a href="/categories"
               class="btn btn-outline-light">
                Catégories
            </a>

            <a href="/films"
               class="btn btn-outline-light">
                Films
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h3 th:if="${categorie.id == null}">
                Ajouter une catégorie
            </h3>

            <h3 th:if="${categorie.id != null}">
                Modifier une catégorie
            </h3>

        </div>


        <div class="card-body">

            <form th:action="@{/categories/enregistrer}"
                  th:object="${categorie}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">


                <div class="mb-3">

                    <label for="nom"
                           class="form-label">
                        Nom de la catégorie
                    </label>

                    <input type="text"
                           id="nom"
                           class="form-control"
                           th:field="*{nom}"
                           placeholder="Exemple : Action"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-success">
                    Enregistrer
                </button>

                <a href="/categories"
                   class="btn btn-secondary">
                    Annuler
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
